description: OneSwoop is a UK car-buying and new-car price-comparison website, founded in 1999 and
  based in Liverpool, England, that lets consumers compare prices on brand-new cars and buy them online
  at a discount. It operates as a consumer-facing e-commerce and comparison property and publishes no
  public developer platform, API, documentation, or SDK surface. Backed historically by Insight Partners
  and other venture investors, it is tracked in the API Evangelist network as a company profile rather
  than an API provider.
